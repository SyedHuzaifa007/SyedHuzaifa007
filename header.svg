<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" dir="ltr">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
      
        <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite" />
        <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite" />
      
    </linearGradient>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="glow1" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0"/>
    </radialGradient>

    
          <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(59, 130, 246, 0.08)" stroke-width="1.2"/>
          </pattern>
        

    <!-- Glassmorphism Card Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&amp;family=Inter:wght@400;600;700;800&amp;family=Outfit:wght@500;700;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
    
    .title {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .tagline {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.01em;
    }

    .code-accent {
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      fill: #64748B;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Glowing Orbs -->
  <rect width="1200" height="320" rx="20" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow2)"/>

  <!-- Pattern Overlay -->
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- Main Card Container Overlay -->
  <rect x="40" y="35" width="1120" height="250" rx="16" fill="rgba(255, 255, 255, 0.55)" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Tech Geometric Decorative Accents -->
  <g opacity="0.6">
    <!-- Top Right Tech Lines -->
    <path d="M 1050 70 L 1100 70 L 1120 90" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="1050" cy="70" r="3" fill="#3B82F6"/>
    <circle cx="1120" cy="90" r="3" fill="#3B82F6"/>

    <!-- Bottom Decorative Terminal Symbol -->
    <text x="1060" y="245" class="code-accent">&lt;/dev&gt;</text>
  </g>

  <!-- Content Group -->
  <!-- Top Greeting Badge -->
  <g transform="translate(80, 70)">
    <rect width="120" height="26" rx="6" fill="rgba(37, 99, 235, 0.08)" stroke="rgba(37, 99, 235, 0.2)" stroke-width="1"/>
    <!-- Greeting Vector Icon -->
    <g transform="translate(10, 5) scale(0.68)" color="#2563EB">
      <path d="M4 17l6-6-6-6M12 19h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <text x="32" y="17" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#2563EB">HELLO WORLD</text>
  </g>

  <!-- Primary Name Title -->
  <text x="80" y="136" class="title" fill="url(#textGrad)">Syed Huzaifa Mustansar</text>

  <!-- Subtitle / Role with Vector Icon -->
  <g transform="translate(80, 153)">
    <g transform="translate(0, 0) scale(0.85)" color="#2563EB">
      <path d="M20 16V7a2 2 0 00-2-2H6a2 2 0 00-2 2v9m-2 3h20a2 2 0 002-2v-1H2v1a2 2 0 002 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <text x="28" y="17" class="subtitle" fill="#2563EB">Software Engineer</text>
  </g>

  <!-- Personal Tagline / Bio Quote with Vector Icon -->
  <g transform="translate(80, 192)">
    <g transform="translate(0, -2) scale(0.72)" color="#64748B">
      <path d="M9 18h6m-4 3h2M12 2a7 7 0 00-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 001 1h6a1 1 0 001-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 00-7-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <text x="24" y="12" class="tagline" fill="#334155" font-weight="500">I like developing and teaching</text>
  </g>

  <!-- Tech Stack Pills -->
  
            <g transform="translate(80, 238)">
              <rect width="112" height="26" rx="13" fill="rgba(219, 234, 254, 0.7)" stroke="#BFDBFE" stroke-width="1"/>
              <!-- Bullet Vector Icon -->
              <g transform="translate(10, 8)" color="#1D4ED8">
                <circle cx="5" cy="5" r="3" fill="#1D4ED8"/>
              </g>
              <text x="62" y="17" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">Full Stack</text>
            </g>
          
            <g transform="translate(202, 238)">
              <rect width="176" height="26" rx="13" fill="rgba(219, 234, 254, 0.7)" stroke="#BFDBFE" stroke-width="1"/>
              <!-- Bullet Vector Icon -->
              <g transform="translate(10, 8)" color="#1D4ED8">
                <circle cx="5" cy="5" r="3" fill="#1D4ED8"/>
              </g>
              <text x="94" y="17" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">Cloud Architecture</text>
            </g>
          
            <g transform="translate(388, 238)">
              <rect width="136" height="26" rx="13" fill="rgba(219, 234, 254, 0.7)" stroke="#BFDBFE" stroke-width="1"/>
              <!-- Bullet Vector Icon -->
              <g transform="translate(10, 8)" color="#1D4ED8">
                <circle cx="5" cy="5" r="3" fill="#1D4ED8"/>
              </g>
              <text x="74" y="17" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">System Design</text>
            </g>
          
            <g transform="translate(534, 238)">
              <rect width="128" height="26" rx="13" fill="rgba(219, 234, 254, 0.7)" stroke="#BFDBFE" stroke-width="1"/>
              <!-- Bullet Vector Icon -->
              <g transform="translate(10, 8)" color="#1D4ED8">
                <circle cx="5" cy="5" r="3" fill="#1D4ED8"/>
              </g>
              <text x="70" y="17" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">React & Node</text>
            </g>
          

  <!-- Sleek Border Frame Overlay -->
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="rgba(203, 213, 225, 0.6)" stroke-width="2"/>
</svg>